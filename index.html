<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유호성 | AI 리터러시 포트폴리오</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body { font-family: 'Pretendard', sans-serif; transition: background-color 0.5s; overflow-x: hidden; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        #modalOverlay { transition: opacity 0.3s ease; display: none; }
        #modalContent { transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #modalOverlay.active { display: flex; opacity: 1; }
        #modalOverlay.active #modalContent { transform: scale(1); }

        .dark-mode { background-color: #020617; color: #f1f5f9; }
        .light-mode { background-color: #fff1f2; color: #0f172a; }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="dark-mode transition-colors duration-700">

    <div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
        <div id="blob1" class="absolute top-[10%] left-[5%] w-64 h-64 rounded-full blur-[100px] opacity-30 animate-pulse bg-purple-600"></div>
        <div id="blob2" class="absolute bottom-[10%] right-[5%] w-80 h-80 rounded-full blur-[100px] opacity-30 animate-pulse bg-cyan-600"></div>
    </div>

    <div class="fixed top-6 right-6 z-50">
        <button id="themeToggle" class="p-4 rounded-3xl border-2 bg-slate-900/80 border-slate-700 text-yellow-400 hover:scale-110 transition-transform">
            <i data-lucide="sun" id="sunIcon"></i>
            <i data-lucide="moon" id="moonIcon" class="hidden"></i>
        </button>
    </div>

    <header class="min-h-screen flex flex-col items-center justify-center text-center px-6">
        <div class="reveal">
            <div class="inline-block px-4 py-1.5 mb-6 rounded-full border border-pink-500/30 bg-pink-500/10 text-pink-400 text-sm font-bold tracking-widest">
                PORTFOLIO 2026
            </div>
            <h1 class="text-6xl md:text-8xl font-black mb-8 tracking-tighter leading-tight">
                AI 리터러시:<br />
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-500">데이터와 꿈의 연결</span>
            </h1>
            <div class="flex flex-col items-center gap-4 mb-12">
                <p class="text-lg md:text-2xl text-slate-400">부산대학교 공공정책학부 유호성</p>
                <div class="flex gap-4">
                    <span class="px-3 py-1 bg-white/5 rounded-lg text-xs text-slate-500 border border-white/10">#생성형AI</span>
                    <span class="px-3 py-1 bg-white/5 rounded-lg text-xs text-slate-500 border border-white/10">#데이터분석</span>
                    <span class="px-3 py-1 bg-white/5 rounded-lg text-xs text-slate-500 border border-white/10">#정책스토리텔링</span>
                </div>
            </div>
            <button onclick="document.getElementById('portfolio').scrollIntoView({ behavior: 'smooth' })" class="px-10 py-5 bg-rose-500 text-white font-black rounded-3xl shadow-lg shadow-rose-500/30 hover:scale-105 transition-transform active:scale-95">과제 아카이브 탐색</button>
        </div>
    </header>

    <section id="portfolio" class="py-32 px-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto">
            <div class="mb-20 text-center reveal">
                <h2 class="text-4xl font-black mb-4 underline decoration-pink-500 underline-offset-8">전체 과제 리스트</h2>
                <p class="text-slate-500 mt-6">한 학기 동안 배운 생성형 AI 활용 능력과 데이터 인사이트 도출 역량의 집약체입니다.</p>
            </div>
            <div id="assignmentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
        </div>
    </section>

    <div id="modalOverlay" class="fixed inset-0 z-[100] items-center justify-center p-6 bg-black/80 backdrop-blur-sm opacity-0">
        <div id="modalContent" class="relative w-full max-w-2xl bg-slate-900 border border-white/10 p-10 rounded-[40px] shadow-2xl overflow-hidden">
            <div class="absolute -top-24 -left-24 w-64 h-64 bg-pink-500/10 rounded-full blur-3xl"></div>
            <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-400 hover:text-white transition-colors">
                <i data-lucide="x"></i>
            </button>
            <div class="relative z-10">
                <div id="modalBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-black text-white bg-gradient-to-r from-pink-500 to-rose-500 mb-6 shadow-md shadow-pink-500/20">과제</div>
                <h2 id="modalTitle" class="text-4xl font-black mb-6 text-white tracking-tight">과제 제목</h2>
                <div class="mb-8">
                    <h3 class="text-slate-500 text-sm font-bold uppercase tracking-widest mb-2">실습 및 학습 내용</h3>
                    <p id="modalDesc" class="text-lg leading-relaxed text-slate-300"></p>
                </div>
                <div class="flex flex-col sm:flex-row gap-4">
                    <a id="modalLink" href="#" class="flex-1 px-8 py-5 bg-rose-500 text-white font-black rounded-2xl text-center flex items-center justify-center gap-2 hover:bg-rose-600 transition-all shadow-lg shadow-rose-500/20 active:scale-95">
                        결과 보기 <i data-lucide="external-link" class="w-5 h-5"></i>
                    </a>
                    <button onclick="closeModal()" class="px-8 py-5 bg-slate-800 text-white font-black rounded-2xl border border-slate-700 hover:bg-slate-700 transition-all active:scale-95">
                        닫기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const assignments = [
            { 
                id: '01', 
                title: 'AI의 이해 (NotebookLM)', 
                desc: 'Google NotebookLM을 활용하여 AI란 무엇이고 발전의 역사와 생성형 AI에 대해 설명해주고 자료정리하는 실습을 진행했습니다.', 
                link: './02/index.html', 
                color: 'from-pink-400 to-rose-500',
                tags: ['#AI기초', '#NotebookLM']
            },
            { 
                id: '02', 
                title: '데이터 스토리텔링', 
                desc: '공공데이터를 분석하고 인사이트를 도출하여 시각적으로 설득력 있는 리포트를 작성하여 스토리북으로 만들기', 
                link: './03/index.html', 
                color: 'from-purple-400 to-indigo-500',
                tags: ['#Gemini 스토리북']
            },
            { 
                id: '03', 
                title: 'AI 윤리와 거버넌스', 
                desc: 'AI 알고리즘의 편향성 문제와 공공 정책적 윤리 가이드라인을 분석하고 미래 기술 사회의 책임을 연구합니다.', 
                link: '#', 
                color: 'from-cyan-400 to-blue-500',
                tags: ['#윤리', '#정책']
            },
            { 
                id: '04', 
                title: '공공 데이터 수집 실습', 
                desc: 'Python 및 다양한 도구를 활용하여 공공 API에서 실시간 데이터를 수집하고 이를 분석 가능한 형태로 구조화했습니다.', 
                link: '#', 
                color: 'from-teal-400 to-emerald-500',
                tags: ['#크롤링', '#데이터수집']
            },
            { 
                id: '05', 
                title: '데이터 정제 및 전처리', 
                desc: '복잡하고 비정형화된 데이터를 분석에 적합하도록 정제하고, 결측치를 처리하여 데이터의 신뢰도를 높이는 실습입니다.', 
                link: '#', 
                color: 'from-green-400 to-lime-500',
                tags: ['#데이터전처리', '#정제']
            },
            { 
                id: '06', 
                title: '통계적 시각화 분석', 
                desc: '데이터 속에 숨겨진 상관관계를 파악하기 위해 다양한 차트와 그래프를 사용하여 시각적 인사이트를 도출했습니다.', 
                link: '#', 
                color: 'from-yellow-400 to-orange-500',
                tags: ['#통계분석', '#시각화']
            },
            { 
                id: '07', 
                title: '생성형 AI 아트워크', 
                desc: 'Midjourney와 DALL-E를 활용하여 브랜드 컨셉에 맞는 창의적인 디지털 에셋을 창조하는 실험적 프로젝트입니다.', 
                link: '#', 
                color: 'from-orange-400 to-red-500',
                tags: ['#AI아트', '#창의성']
            },
            { 
                id: '08', 
                title: 'AI 기반 문제해결 설계', 
                desc: '공공 정책 영역에서 발생하는 고질적인 문제들을 AI 기술을 접목하여 혁신적으로 해결하는 시나리오를 설계했습니다.', 
                link: '#', 
                color: 'from-rose-400 to-pink-500',
                tags: ['#문제해결', '#디자인']
            },
            { 
                id: '09', 
                title: '빅데이터 정책 분석 리포트', 
                desc: '대규모 인구 및 사회 데이터를 분석하여 실질적인 공공 정책 제언으로 연결하는 심층 분석 리포트입니다.', 
                link: '#', 
                color: 'from-fuchsia-400 to-purple-500',
                tags: ['#정책분석', '#빅데이터']
            },
            { 
                id: '10', 
                title: '최종 캡스톤 프로젝트', 
                desc: '학기 전체 과정을 통해 습득한 AI 리터러시 역량을 하나로 집약한 최종 통합 프로젝트 결과물입니다.', 
                link: '#', 
                color: 'from-violet-400 to-purple-600',
                tags: ['#캡스톤', '#최종결과물']
            }
        ];

        function renderCards() {
            const grid = document.getElementById('assignmentGrid');
            grid.innerHTML = '';
            assignments.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = `reveal group relative border-2 p-8 rounded-[40px] cursor-pointer transition-all duration-500 hover:scale-[1.05] bg-white/5 border-white/10 hover:border-pink-500/50 overflow-hidden shadow-xl shadow-black/20`;
                card.onclick = () => openModal(item);
                
                card.innerHTML = `
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-gradient-to-br ${item.color} opacity-10 rounded-full blur-2xl transition-opacity group-hover:opacity-30"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-6">
                            <div class="px-4 py-1.5 rounded-full text-[10px] font-black text-white bg-gradient-to-r ${item.color} shadow-sm">과제 ${item.id}</div>
                            <button onclick="event.stopPropagation(); window.location.href='${item.link}';" class="p-2 rounded-full bg-white/5 text-rose-500 hover:bg-rose-500 hover:text-white transition-all shadow-inner" title="바로 이동">
                                <i data-lucide="external-link" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <h3 class="text-2xl font-black mb-4 group-hover:text-pink-400 transition-colors">${item.title}</h3>
                        <p class="text-sm text-slate-400 line-clamp-2 mb-6">${item.desc}</p>
                        <div class="flex flex-wrap gap-2">
                            ${item.tags.map(tag => `<span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">${tag}</span>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function openModal(data) {
            const modal = document.getElementById('modalOverlay');
            document.getElementById('modalBadge').innerText = `과제 ${data.id}`;
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalDesc').innerText = data.desc;
            document.getElementById('modalLink').href = data.link;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modalOverlay');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });

        const themeBtn = document.getElementById('themeToggle');
        themeBtn.onclick = () => {
            const body = document.body;
            const sun = document.getElementById('sunIcon');
            const moon = document.getElementById('moonIcon');
            if (body.classList.contains('dark-mode')) {
                body.classList.replace('dark-mode', 'light-mode');
                sun.classList.add('hidden');
                moon.classList.remove('hidden');
            } else {
                body.classList.replace('light-mode', 'dark-mode');
                sun.classList.remove('hidden');
                moon.classList.add('hidden');
            }
        };

        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, observerOptions);

        window.onload = () => {
            renderCards();
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        };
    </script>
</body>
</html>
