<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유호성 | AI 리터러시 포트폴리오</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; transition: background-color 0.5s; overflow-x: hidden; margin: 0; }
        
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        #modalOverlay { 
            transition: opacity 0.3s ease; 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 100; 
            align-items: center; 
            justify-content: center; 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(8px);
        }
        #modalContent { transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #modalOverlay.active { display: flex; opacity: 1; }
        #modalOverlay.active #modalContent { transform: scale(1); }

        .dark-mode { background-color: #020617; color: #f1f5f9; }
        .light-mode { background-color: #fff1f2; color: #0f172a; }
        
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .nav-btn:hover { box-shadow: 0 0 20px rgba(244, 63, 94, 0.3); }
    </style>
</head>
<body class="dark-mode transition-colors duration-700">

    <div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
        <div id="blob1" class="absolute top-[10%] left-[5%] w-64 h-64 rounded-full blur-[100px] opacity-30 animate-pulse bg-purple-600"></div>
        <div id="blob2" class="absolute bottom-[10%] right-[5%] w-80 h-80 rounded-full blur-[100px] opacity-30 animate-pulse bg-cyan-600"></div>
    </div>

    <!-- 좌측 상단 네비게이션 -->
    <div class="fixed top-6 left-6 z-50 flex flex-col gap-3">
        <a href="#" class="nav-btn flex items-center gap-2 px-4 py-2.5 bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl shadow-lg hover:bg-white/20 transition-all group">
            <i data-lucide="home" class="w-5 h-5 text-rose-500"></i>
            <span class="text-sm font-black group-hover:text-rose-400 text-white">홈으로</span>
        </a>
        <a href="https://gemini.google.com/share/35b9564f5795" target="_blank" class="nav-btn flex items-center gap-2 px-4 py-2.5 bg-rose-500/10 backdrop-blur-md border border-rose-500/20 rounded-2xl shadow-lg hover:bg-rose-500/20 transition-all group">
            <i data-lucide="book-open" class="w-5 h-5 text-cyan-400"></i>
            <span class="text-sm font-black text-rose-400 group-hover:text-rose-300">스토리북 보기</span>
        </a>
    </div>

    <div class="fixed top-6 right-6 z-50">
        <button id="themeToggle" class="p-4 rounded-3xl border-2 bg-slate-900/80 border-slate-700 text-yellow-400 hover:scale-110 transition-transform">
            <i data-lucide="sun" id="sunIcon"></i>
            <i data-lucide="moon" id="moonIcon" class="hidden"></i>
        </button>
    </div>

    <header class="min-h-screen flex flex-col items-center justify-center text-center px-6">
        <div class="reveal">
            <div class="inline-block px-4 py-1.5 mb-6 rounded-full border border-pink-500/30 bg-pink-500/10 text-pink-400 text-sm font-bold tracking-widest uppercase">Portfolio 2026</div>
            <h1 class="text-6xl md:text-8xl font-black mb-8 tracking-tighter leading-tight text-white">
                AI 리터러시:<br /><span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-500">데이터와 꿈의 연결</span>
            </h1>
            <div class="flex flex-col items-center gap-6 mb-12">
                <img src="https://cdn.topstarnews.net/news/photo/202507/15721511_1631739_3119.jpg" alt="유호성" class="w-32 h-32 rounded-full object-cover border-4 border-white/10 shadow-2xl transition-transform hover:scale-105 duration-500">
                <div>
                    <p class="text-2xl font-black text-white">유호성 (Yu Ho-seong)</p>
                    <p class="text-slate-400 font-bold">부산대학교 공공정책학부</p>
                </div>
            </div>
            <button onclick="document.getElementById('portfolio').scrollIntoView({ behavior: 'smooth' })" class="px-10 py-5 bg-rose-500 text-white font-black rounded-3xl shadow-lg hover:scale-105 transition-transform">과제 아카이브 탐색</button>
        </div>
    </header>

    <section id="portfolio" class="py-32 px-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto">
            <div class="mb-20 text-center reveal">
                <h2 class="text-4xl font-black mb-4 underline decoration-pink-500 underline-offset-8 uppercase text-white">Archive</h2>
            </div>
            <div id="assignmentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
        </div>
    </section>

    <!-- 모달 레이어 (다이렉트 링크가 아닌 과제들용) -->
    <div id="modalOverlay" class="fixed inset-0 z-[100] items-center justify-center p-6 bg-black/80 backdrop-blur-sm opacity-0">
        <div id="modalContent" class="relative w-full max-w-2xl bg-slate-900 border border-white/10 p-10 rounded-[40px] shadow-2xl overflow-hidden text-white">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-400 hover:text-white transition-colors"><i data-lucide="x"></i></button>
            <div class="relative z-10">
                <div id="modalBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-black text-white bg-gradient-to-r from-pink-500 to-rose-500 mb-6 uppercase">Assignment</div>
                <h2 id="modalTitle" class="text-4xl font-black mb-6 tracking-tight"></h2>
                <div class="mb-8">
                    <h3 class="text-slate-500 text-sm font-bold uppercase tracking-widest mb-2">실습 내용</h3>
                    <p id="modalDesc" class="text-lg leading-relaxed text-slate-300"></p>
                </div>
                <div class="flex flex-col sm:flex-row gap-4">
                    <a id="modalLink" href="#" target="_blank" class="flex-1 px-8 py-5 bg-rose-500 text-white font-black rounded-2xl text-center flex items-center justify-center gap-2 hover:bg-rose-600 transition-all shadow-lg active:scale-95">결과물 확인 <i data-lucide="external-link" class="w-5 h-5"></i></a>
                    <button onclick="closeModal()" class="px-8 py-5 bg-slate-800 text-white font-black rounded-2xl border border-slate-700 hover:bg-slate-700 transition-all active:scale-95">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const assignments = [
            { id: '01', title: 'AI의 이해 (NotebookLM)', desc: 'Google NotebookLM을 활용하여 AI의 역사와 발전 원리를 심도 있게 분석했습니다.', link: './02/index.html', color: 'from-pink-400 to-rose-500' },
            { id: '02', title: '데이터 스토리텔링', desc: '공공데이터를 분석하여 설득력 있는 디지털 스토리북을 제작했습니다.', link: 'https://gemini.google.com/share/35b9564f5795', color: 'from-purple-400 to-indigo-500' },
            { id: '03', title: 'AI 윤리와 거버넌스', desc: 'AI 기술 발전에 따른 윤리적 쟁점과 공공 정책적 거버넌스를 연구한 랜딩페이지입니다.', link: './03/index.html', color: 'from-cyan-400 to-blue-500', directLink: true }, 
            { id: '04', title: '웹기술의 이해(실습과제)', desc: 'HTML, CSS, JS의 기초를 배우고 나만의 포트폴리오 결과물을 확인하는 페이지입니다.', link: './04/index.html', color: 'from-teal-400 to-emerald-500', directLink: true },
            { id: '05', title: '데이터 정제 및 전처리', desc: '데이터의 신뢰도를 높이기 위한 정제 및 전처리 과정을 실습했습니다.', link: '#', color: 'from-green-400 to-lime-500' },
            { id: '06', title: '통계적 시각화 분석', desc: '수치 데이터를 시각화하여 트렌드를 도출하는 역량을 키웠습니다.', link: '#', color: 'from-yellow-400 to-orange-500' },
            { id: '07', title: '생성형 AI 아트워크', desc: 'AI 이미지 생성 도구를 활용하여 정책 아이디어를 시각화했습니다.', link: '#', color: 'from-orange-400 to-red-500' },
            { id: '08', title: 'AI 기반 문제해결 설계', desc: '사회 문제를 AI 기술로 해결하기 위한 서비스 시나리오를 설계했습니다.', link: '#', color: 'from-rose-400 to-pink-500' },
            { id: '09', title: '빅데이터 정책 리포트', desc: '데이터 기반의 실질적인 정책 제언 리포트를 작성했습니다.', link: '#', color: 'from-fuchsia-400 to-purple-500' },
            { id: '10', title: '최종 캡스톤 프로젝트', desc: '한 학기 역량을 집약한 최종 통합 결과물입니다.', link: '#', color: 'from-violet-400 to-purple-600' }
        ];

        function renderCards() {
            const grid = document.getElementById('assignmentGrid');
            grid.innerHTML = '';
            assignments.forEach((item) => {
                const card = document.createElement('div');
                card.className = `reveal group relative border-2 p-8 rounded-[40px] cursor-pointer transition-all duration-500 hover:scale-[1.05] bg-white/5 border-white/10 hover:border-pink-500/50 overflow-hidden shadow-xl`;
                
                card.onclick = () => {
                    if (item.directLink && item.link !== '#') {
                        window.location.href = item.link; 
                    } else {
                        openModal(item);
                    }
                };
                
                card.innerHTML = `
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-gradient-to-br ${item.color} opacity-10 rounded-full blur-2xl"></div>
                    <div class="relative z-10 h-full flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-6">
                                <div class="px-4 py-1.5 rounded-full text-[10px] font-black text-white bg-gradient-to-r ${item.color}">과제 ${item.id}</div>
                                <i data-lucide="${item.directLink ? 'external-link' : 'plus-circle'}" class="text-rose-500 group-hover:rotate-12 transition-transform"></i>
                            </div>
                            <h3 class="text-2xl font-black mb-4 group-hover:text-pink-400 transition-colors text-white">${item.title}</h3>
                            <p class="text-sm text-slate-400 line-clamp-2">${item.desc}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function openModal(data) {
            const modal = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalDesc').innerText = data.desc;
            document.getElementById('modalLink').href = data.link;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modalOverlay');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('themeToggle').onclick = () => {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
            document.getElementById('sunIcon').classList.toggle('hidden');
            document.getElementById('moonIcon').classList.toggle('hidden');
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
        }, { threshold: 0.1 });

        window.onload = () => {
            renderCards();
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
            lucide.createIcons();
        };
    </script>
</body>
</html>
